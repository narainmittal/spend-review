<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">From statements to a budget you can review</title>
<desc id="desc">Six steps: agree the scope, read every account, reconcile source totals, review exceptions with a human, consolidate approved spending, then explore charts. Unclear or missing source data returns to review rather than being guessed. Public examples are synthetic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8094a7"/></marker></defs>
<rect width="1200" height="1500" fill="#f6f7fa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="90" y="95" fill="#52677b" font-size="22" letter-spacing="3">SPEND REVIEW · AN AI-ASSISTED WORKFLOW</text>
<text x="90" y="166" fill="#17283a" font-size="52" font-weight="700">From statements to a budget</text>
<text x="90" y="229" fill="#17283a" font-size="52" font-weight="700">you can review</text>
<text x="90" y="284" fill="#52677b" font-size="25">Automation for the repetition. Human review for the exceptions.</text>
<g stroke="#8094a7" stroke-width="3" marker-end="url(#arrow)">
<path d="M 600 440 V 476"/><path d="M 600 602 V 638"/><path d="M 600 764 V 800"/>
<path d="M 600 926 V 962"/><path d="M 600 1088 V 1124"/>
</g>
<g fill="#fff" stroke="#dbe3ec" stroke-width="2">
<rect x="180" y="314" width="840" height="126" rx="18"/>
<rect x="180" y="476" width="840" height="126" rx="18"/>
<rect x="180" y="638" width="840" height="126" rx="18"/>
<rect x="180" y="800" width="840" height="126" rx="18" fill="#e8f2f6" stroke="#2580a3"/>
<rect x="180" y="962" width="840" height="126" rx="18"/>
<rect x="180" y="1124" width="840" height="126" rx="18"/>
</g>
<g fill="#165c7b" font-size="24" font-weight="700">
<text x="218" y="366">01</text><text x="218" y="528">02</text><text x="218" y="690">03</text>
<text x="218" y="852">04</text><text x="218" y="1014">05</text><text x="218" y="1176">06</text>
</g>
<g fill="#17283a" font-size="30" font-weight="700">
<text x="282" y="367">Agree the scope</text><text x="282" y="529">Read every account</text>
<text x="282" y="691">Reconcile the source totals</text><text x="282" y="853">Review exceptions together</text>
<text x="282" y="1015">Consolidate approved spending</text><text x="282" y="1177">Explore the result</text>
</g>
<g fill="#52677b" font-size="23">
<text x="282" y="407">Accounts, dates, currencies and review thresholds</text>
<text x="282" y="569">Preserve transactions and page-level evidence</text>
<text x="282" y="731">Check signs, missing pages and statement balances</text>
<text x="282" y="893">Confirm refunds, exclusions and unclear transactions</text>
<text x="282" y="1055">Count purchases once; keep currencies separate</text>
<text x="282" y="1217">Filter by account, month and currency; inspect charts</text>
</g>
<path d="M 1020 863 H 1100 V 539 H 1035" fill="none" stroke="#2580a3" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1090" y="721" fill="#165c7b" font-size="20" text-anchor="middle" transform="rotate(-90 1090 721)">Missing or unclear? Go back.</text>
<text x="90" y="1340" fill="#17283a" font-size="26" font-weight="700">Repeatable steps. Saved decisions. Traceable totals.</text>
<text x="90" y="1393" fill="#52677b" font-size="22">No invented transactions or exchange rates. Public demos use synthetic data.</text>
<text x="90" y="1434" fill="#52677b" font-size="22">The workflow helps with analysis; it does not replace reviewing your numbers.</text>
</g></svg>
