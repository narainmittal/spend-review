name: Public toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python skills/budget-analysis/scripts/budget.py validate examples/synthetic
      - run: python tools/check_public.py
      - run: python tools/package_public.py
